<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --text-primary: #f5f5f5;
            --text-secondary: #a8a8a8;
            --accent-warm: #ff6b6b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Crimson Pro', serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .error-container { padding: 40px; }
        .error-code {
            font-family: 'Space Mono', monospace;
            font-size: 8rem;
            font-weight: 700;
            color: var(--accent-warm);
            line-height: 1;
        }
        .error-message {
            font-size: 1.5rem;
            margin: 20px 0;
            color: var(--text-secondary);
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-primary);
            border: 1px solid var(--text-secondary);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .back-link:hover {
            background: var(--accent-warm);
            border-color: var(--accent-warm);
            color: var(--bg-primary);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <p class="error-message" th:text="${error} ?: 'Page not found'">Page not found</p>
        <a href="/organizations" class="back-link">← Back to Home</a>
    </div>
</body>
</html>
