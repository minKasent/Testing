<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Organization - Lab 4</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --text-primary: #f5f5f5;
            --text-secondary: #a8a8a8;
            --accent-primary: #00d4aa;
            --accent-secondary: #00b894;
            --accent-warm: #ff6b6b;
            --border-color: #333;
            --input-bg: #1f1f1f;
            --success: #00d4aa;
            --error: #ff6b6b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Crimson Pro', Georgia, serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(0, 212, 170, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 107, 107, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container { max-width: 700px; margin: 0 auto; padding: 40px 24px; }

        .header {
            text-align: center;
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--accent-primary);
            border-radius: 2px;
        }

        .form-group { margin-bottom: 24px; }

        .form-label {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .form-label .required {
            color: var(--accent-warm);
            margin-left: 4px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            font-family: 'Crimson Pro', serif;
            font-size: 1.1rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.1);
        }

        .form-input.error {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .form-input:read-only {
            background: var(--bg-tertiary);
            cursor: not-allowed;
        }

        .error-message {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--error);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .error-message::before {
            content: '!';
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            background: var(--error);
            color: var(--bg-primary);
            border-radius: 50%;
            font-size: 0.65rem;
            font-weight: bold;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        .btn-primary:hover {
            background: var(--accent-secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 170, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-tertiary);
            border-color: var(--text-secondary);
        }

        .btn-director {
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            color: white;
        }

        .btn-director:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.4);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .alert-success {
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert-success::before {
            content: '✓';
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: var(--success);
            color: var(--bg-primary);
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .form-hint {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        @media (max-width: 640px) {
            .container { padding: 24px 16px; }
            .header h1 { font-size: 1.8rem; }
            .card { padding: 24px; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>New Organization</h1>
            <p>Lab 4 - Software Testing</p>
        </header>

        <div class="card">
            <h2 class="card-title">Organization Details</h2>

            <!-- Success Message -->
            <div th:if="${successMessage}" class="alert alert-success">
                <span th:text="${successMessage}">Save successfully</span>
            </div>

            <form th:action="@{/organizations/save}" th:object="${organizationDTO}" method="post">
                
                <!-- Organization Name -->
                <div class="form-group">
                    <label class="form-label" for="orgName">
                        Organization Name <span class="required">*</span>
                    </label>
                    <input type="text" 
                           id="orgName" 
                           th:field="*{orgName}" 
                           class="form-input" 
                           th:classappend="${#fields.hasErrors('orgName')} ? 'error' : ''"
                           placeholder="Enter organization name"
                           th:readonly="${savedOrgId != null}"
                           maxlength="255">
                    <div th:if="${#fields.hasErrors('orgName')}" class="error-message">
                        <span th:errors="*{orgName}">Error</span>
                    </div>
                    <div class="form-hint">3-255 characters, must be unique</div>
                </div>

                <!-- Address -->
                <div class="form-group">
                    <label class="form-label" for="address">Address</label>
                    <input type="text" 
                           id="address" 
                           th:field="*{address}" 
                           class="form-input"
                           placeholder="Enter address"
                           th:readonly="${savedOrgId != null}"
                           maxlength="255">
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label class="form-label" for="phone">Phone</label>
                    <input type="text" 
                           id="phone" 
                           th:field="*{phone}" 
                           class="form-input"
                           th:classappend="${#fields.hasErrors('phone')} ? 'error' : ''"
                           placeholder="Enter phone number"
                           th:readonly="${savedOrgId != null}"
                           maxlength="12">
                    <div th:if="${#fields.hasErrors('phone')}" class="error-message">
                        <span th:errors="*{phone}">Error</span>
                    </div>
                    <div class="form-hint">9-12 digits only</div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" 
                           id="email" 
                           th:field="*{email}" 
                           class="form-input"
                           th:classappend="${#fields.hasErrors('email')} ? 'error' : ''"
                           placeholder="Enter email address"
                           th:readonly="${savedOrgId != null}"
                           maxlength="100">
                    <div th:if="${#fields.hasErrors('email')}" class="error-message">
                        <span th:errors="*{email}">Error</span>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="btn-group">
                    <button type="submit" class="btn btn-primary" th:disabled="${savedOrgId != null}">
                        💾 Save
                    </button>
                    
                    <a th:href="@{/directors/organization/{id}(id=${savedOrgId})}" 
                       class="btn btn-director"
                       th:classappend="${savedOrgId == null} ? 'disabled' : ''"
                       th:if="${savedOrgId != null}">
                        👤 Director
                    </a>
                    
                    <button type="button" class="btn btn-director" disabled th:unless="${savedOrgId != null}">
                        👤 Director
                    </button>
                    
                    <a th:href="@{/organizations}" class="btn btn-secondary">
                        ← Back
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
