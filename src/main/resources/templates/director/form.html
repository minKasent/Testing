<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Director Management - Lab 4</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --text-primary: #f5f5f5;
            --text-secondary: #a8a8a8;
            --accent-primary: #00d4aa;
            --accent-secondary: #00b894;
            --accent-warm: #ff6b6b;
            --accent-purple: #6c5ce7;
            --border-color: #333;
            --input-bg: #1f1f1f;
            --success: #00d4aa;
            --error: #ff6b6b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Crimson Pro', Georgia, serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(108, 92, 231, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 212, 170, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 40px 24px; }

        .header {
            text-align: center;
            margin-bottom: 48px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .org-info {
            background: var(--bg-tertiary);
            border: 1px solid var(--accent-purple);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .org-info-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-purple) 0%, #a29bfe 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .org-info-text h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .org-info-text p {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--accent-purple);
            border-radius: 2px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .form-label .required {
            color: var(--accent-warm);
            margin-left: 4px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            font-family: 'Crimson Pro', serif;
            font-size: 1rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .form-input.error {
            border-color: var(--error);
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .error-message {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--error);
            margin-top: 6px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple) 0%, #a29bfe 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-tertiary);
            border-color: var(--text-secondary);
        }

        .alert {
            padding: 14px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-top: 16px;
        }

        table { width: 100%; border-collapse: collapse; }

        th {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 14px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(108, 92, 231, 0.03); }

        .empty-state {
            text-align: center;
            padding: 32px 24px;
            color: var(--text-secondary);
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            color: var(--text-secondary);
        }

        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Director Management</h1>
            <p>Lab 4 - Software Testing</p>
        </header>

        <!-- Organization Info -->
        <div class="org-info">
            <div class="org-info-icon">🏢</div>
            <div class="org-info-text">
                <h3 th:text="${organization.orgName}">Organization Name</h3>
                <p th:text="'ID: ' + ${organization.orgId}">ID: 1</p>
            </div>
        </div>

        <!-- Add Director Form -->
        <div class="card">
            <h2 class="card-title">Add New Director</h2>

            <div th:if="${successMessage}" class="alert alert-success">
                ✓ <span th:text="${successMessage}">Director saved successfully</span>
            </div>

            <form th:action="@{/directors/save}" th:object="${directorDTO}" method="post">
                <input type="hidden" th:field="*{orgId}">
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="directorName">
                            Director Name <span class="required">*</span>
                        </label>
                        <input type="text" 
                               id="directorName" 
                               th:field="*{directorName}" 
                               class="form-input"
                               th:classappend="${#fields.hasErrors('directorName')} ? 'error' : ''"
                               placeholder="Enter director name"
                               maxlength="255">
                        <div th:if="${#fields.hasErrors('directorName')}" class="error-message">
                            <span th:errors="*{directorName}">Error</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" 
                               id="email" 
                               th:field="*{email}" 
                               class="form-input"
                               th:classappend="${#fields.hasErrors('email')} ? 'error' : ''"
                               placeholder="Enter email"
                               maxlength="100">
                        <div th:if="${#fields.hasErrors('email')}" class="error-message">
                            <span th:errors="*{email}">Error</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Phone</label>
                    <input type="text" 
                           id="phone" 
                           th:field="*{phone}" 
                           class="form-input"
                           th:classappend="${#fields.hasErrors('phone')} ? 'error' : ''"
                           placeholder="Enter phone number"
                           maxlength="12"
                           style="max-width: 300px;">
                    <div th:if="${#fields.hasErrors('phone')}" class="error-message">
                        <span th:errors="*{phone}">Error</span>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">
                        ➕ Add Director
                    </button>
                    <a th:href="@{/organizations}" class="btn btn-secondary">
                        ← Back to Organizations
                    </a>
                </div>
            </form>
        </div>

        <!-- Directors List -->
        <div class="card">
            <h2 class="card-title">Directors List</h2>

            <div th:if="${#lists.isEmpty(directors)}" class="empty-state">
                No directors added yet.
            </div>

            <div th:unless="${#lists.isEmpty(directors)}" class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="director : ${directors}">
                            <td><span class="badge" th:text="${director.directorId}">1</span></td>
                            <td th:text="${director.directorName}">Director Name</td>
                            <td th:text="${director.email} ?: '-'">Email</td>
                            <td th:text="${director.phone} ?: '-'">Phone</td>
                            <td th:text="${#temporals.format(director.createdDate, 'dd/MM/yyyy HH:mm')}">01/01/2024</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
